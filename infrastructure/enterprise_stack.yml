version: '3.8'

services:
  # 1. Redis (Hot Cache)
  redis:
    image: redis:alpine
    container_name: actis-redis
    ports:
      - "6379:6379"

  # 2. MinIO (S3 Data Lake Simulator) - Temporarily disabled due to registry issues

  # 3. HashiCorp Vault (Secrets Management)
  vault:
    image: hashicorp/vault
    container_name: actis-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  # 4. Confluent Schema Registry (Data Governance)
  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: actis-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://host.docker.internal:9092' # Connects to our existing Kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 5. Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: actis-prometheus
    ports:
      - "9090:9090"

  # 6. Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: actis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # 7. Loki (Log Aggregation)
  loki:
    image: grafana/loki:latest
    container_name: actis-loki
    ports:
      - "3100:3100"

  # 8. Tempo (Distributed Tracing)
  tempo:
    image: grafana/tempo:latest
    container_name: actis-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"

  # 9. Apache Flink JobManager (Stream Processing)
  jobmanager:
    image: flink:latest
    container_name: actis-flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

  # 10. Apache Flink TaskManager
  taskmanager:
    image: flink:latest
    container_name: actis-flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
