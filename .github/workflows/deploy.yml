name: Exodia CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install langchain langchain-community langchain-ollama qdrant-client fastapi uvicorn redis

      - name: Lint Codebase
        run: |
          pip install flake8
          flake8 ai_engine/ data_pipeline/ api_gateway/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build Next.js Dashboard
        working-directory: ./exodia-web
        run: |
          npm ci
          npm run build

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push AI Engine Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/Dockerfile.ai
          push: true
          tags: exodia/ai-engine:latest,exodia/ai-engine:${{ github.sha }}

  # ArgoCD takes over the deployment from here via GitOps.
  # We just update the manifest tags in the repo to trigger Argo.
  update-k8s-manifests:
    name: Update ArgoCD Manifests
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Update Image Tag
        run: |
          sed -i "s|image: exodia/ai-engine:.*|image: exodia/ai-engine:${{ github.sha }}|g" infrastructure/k8s/ai-deployment.yml
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add infrastructure/k8s/ai-deployment.yml
          git commit -m "chore: update ai-engine image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push
